name: "🐛 Bug Report"
description: "File a bug report for an Aero Linux component or application"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue in Aero Linux! Please fill out the details below.
  - type: input
    id: component
    attributes:
      label: Component / Application
      description: Which Aero Linux component or GTK3 app is affected? (e.g. aero-doctor, aero-memory, aero-ai)
      placeholder: aero-doctor
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run 'aero ...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: System Environment
      description: Output of `aero doctor --summary` or your kernel/OS info.
      render: bash
    validations:
      required: false
